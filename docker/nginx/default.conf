server {
    listen 80;
    server_name _;

    root /app/public;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/vnd.mapbox-vector-tile
               text/css application/javascript;

    # Static files first, everything else goes to the PHP front controller.
    location / {
        try_files $uri $uri/ @php;
    }

    # Never serve PHP sources; only the front controller is executed (via @php).
    location ~ \.php$ {
        return 404;
    }

    location @php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}
