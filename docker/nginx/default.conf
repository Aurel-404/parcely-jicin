server {
    listen 80;
    server_name _;

    root /app/public;
    index index.html;

    add_header X-Content-Type-Options nosniff always;

    # Level 5, measured: boundaries 2.2 MB → 626 kB (level 1: 722 kB) for +42 ms once a day per browser,
    # the largest z13 tile 472 → 308 kB for +7 ms; levels 6-9 save < 1 % more and cost up to 10× the time.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/geo+json application/vnd.mapbox-vector-tile application/x-protobuf
               text/css application/javascript;

    # Static files first, everything else goes to the PHP front controller.
    location / {
        try_files $uri $uri/ @php;
    }

    # Never serve PHP sources; only the front controller is executed (via @php).
    location ~ \.php$ {
        return 404;
    }

    # The frontend has no build step and no hashed file names: the browser revalidates (ETag, usually 304),
    # so a changed app.js is used at once. add_header here replaces the server-level ones, hence repeated.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Label glyphs (public/fonts): never change, so the browser keeps them for 30 days.
    location /fonts/ {
        types {
            application/x-protobuf pbf;
            text/plain txt;
        }
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location @php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
}
