[www]
; Pass container environment (DB_*, APP_ENV) to PHP workers; FPM clears it by default.
clear_env = no

; The map requests many tiles in parallel, so keep enough workers ready.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000
