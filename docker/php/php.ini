date.timezone = Europe/Prague
memory_limit = 256M
expose_php = Off

; Errors go to the log (container stderr), never into responses - the app returns JSON errors itself.
display_errors = Off
log_errors = On
error_reporting = E_ALL
; Logged stack traces without function arguments, which could contain parameters or credentials.
zend.exception_ignore_args = On

; Timestamps are not validated: on a bind mount from the Windows file system every stat() takes ~9 ms
; (measured), so revalidating ~40 files added 0.5-1.7 s to a request every 2 s. After changing PHP code
; run "docker compose restart php"; CLI scripts and tests run without OPcache and always see the current code.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
