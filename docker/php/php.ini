date.timezone = Europe/Prague
memory_limit = 256M
expose_php = Off

; Errors go to the log (container stderr), never into responses - the app returns JSON errors itself.
display_errors = Off
log_errors = On
error_reporting = E_ALL

; The project is bind-mounted for development, so timestamps are still validated.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
